[project]
name = "airs-mvp"
version = "0.1.0"
description = "AI Incident Response System MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiokafka>=0.10.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "opensearch-py>=2.8.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.8.0",
  "prometheus-client>=0.21.1",
  "python-dateutil>=2.9.0",
  "PyYAML>=6.0.2",
  "redis>=5.2.0",
  "uvicorn>=0.34.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "shared"]
testpaths = ["tests"]
markers = [
  "chaos: runs against a live stack, needs AIRS_CHAOS=1 (see tests/chaos)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
