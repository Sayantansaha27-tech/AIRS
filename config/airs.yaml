app:
  name: AIRS
  environment: local

kafka:
  bootstrap_servers: kafka:9092
  topics:
    logs: logs-topic
    processed_logs: processed-logs-topic
    anomalies: anomalies-topic
    incidents: incidents-topic
    dlq: airs-dlq-topic

redis:
  url: redis://redis:6379/0

opensearch:
  url: http://opensearch:9200
  logs_index: airs-logs
  incidents_index: airs-incidents
  sources_index: airs-sources

llm:
  # Which provider below to use. Change this one line to switch everything.
  provider: ollama
  timeout_seconds: 8
  retries: 2

  # Severity to tier. "deterministic" skips the model entirely.
  # Want the capable model on everything? Set warning and info to primary.
  routing:
    critical: primary
    warning: economy
    info: deterministic

  # Each provider declares its own model for each tier, so switching provider
  # moves both tiers together. `kind` picks the adapter that talks to it.
  providers:
    ollama:
      kind: ollama
      base_url: http://ollama:11434
      # Measured 20s median for the 1.5B on CPU-only Docker Desktop. The global
      # 8s below suits a hosted API, not a local model, so override it here.
      timeout_seconds: 180
      models:
        primary: qwen2.5:7b-instruct
        economy: qwen2.5:1.5b-instruct

    openai:
      kind: openai_compatible
      base_url: https://api.openai.com/v1
      api_key_env: OPENAI_API_KEY
      models:
        primary: gpt-4.1
        economy: gpt-4.1-mini

    anthropic:
      kind: anthropic
      base_url: https://api.anthropic.com/v1
      api_key_env: ANTHROPIC_API_KEY
      models:
        primary: claude-sonnet-5
        economy: claude-haiku-4-5-20251001

    # Anything speaking the OpenAI chat-completions API works with kind:
    # openai_compatible and no code change. A few worked examples:

    # groq:
    #   kind: openai_compatible
    #   base_url: https://api.groq.com/openai/v1
    #   api_key_env: GROQ_API_KEY
    #   models: {primary: llama-3.3-70b-versatile, economy: llama-3.1-8b-instant}

    # openrouter:
    #   kind: openai_compatible
    #   base_url: https://openrouter.ai/api/v1
    #   api_key_env: OPENROUTER_API_KEY
    #   models: {primary: anthropic/claude-sonnet-4.5, economy: google/gemini-2.0-flash-001}

    # vllm:                      # or LM Studio, llama.cpp server, TGI
    #   kind: openai_compatible  # usually needs no api_key_env at all
    #   base_url: http://localhost:8000/v1
    #   models: {primary: meta-llama/Llama-3.3-70B-Instruct, economy: Qwen/Qwen2.5-7B-Instruct}

connectors:
  servicenow:
    # Turn on once SERVICENOW_PASSWORD is set in .env. See docs/10-servicenow.md
    enabled: false
    instance_url: https://dev386810.service-now.com
    username: admin
    password_env: SERVICENOW_PASSWORD
    tenant_id: default
    poll_interval_seconds: 60
    page_size: 50
    # Leave true until you have read what it would write. See docs/10-servicenow.md
    dry_run: true

pipeline:
  baseline_window_minutes: 15
  correlation_window_minutes: 10
  anomaly_threshold: 2.5
  dashboard_poll_seconds: 5
  source_poll_tick_seconds: 5
  log_retention_days: 5
  incident_retention_days: 30
  max_log_payload_kb: 256
  max_manual_analyze_kb: 512
